name: PR Multi-Version Tests

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened] 

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    name: Py ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Legacy versions pinned to older Ubuntu
          - python-version: "3.6"
            os: ubuntu-20.04
          - python-version: "3.7"
            os: ubuntu-20.04
          # Modern versions using latest Ubuntu
          - python-version: "3.8"
            os: ubuntu-latest
          - python-version: "3.9"
            os: ubuntu-latest
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Fix Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Dependencies
        shell: bash
        run: |
          VERSION="${{ matrix.python-version }}"
          
          # Handle dependency limits for EOL versions
          if [[ "$VERSION" == "3.6"* ]]; then
            python -m pip install --upgrade "pip<21.0" "setuptools<60.0" "wheel"
            pip install "pytest<7.0" "pytest-html<3.0" "setuptools-scm<7.0"
          elif [[ "$VERSION" == "3.7"* ]]; then
            python -m pip install --upgrade "pip<23.1" "setuptools<60.0" "wheel"
            pip install "pytest<8.0" "pytest-html<4.0" "setuptools-scm<8.0"
          else
            python -m pip install --upgrade pip setuptools wheel
            pip install pytest pytest-html setuptools-scm
          fi
          
          # Provide dummy version for 3.14 alpha issues with setuptools-scm
          if [[ "$VERSION" == "3.14"* ]]; then
             export SETUPTOOLS_SCM_PRETEND_VERSION="0.0.1.dev0"
          fi
          
          pip install .

      - name: Run Tests
        id: run_tests
        run: |
          pytest --html=report-${{ matrix.python-version }}.html --self-contained-html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: report-${{ matrix.python-version }}.html

      - name: Post Status Comment
        if: always()
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### 🧪 Test Results: Python ${{ matrix.python-version }}
            - **Status:** ${{ steps.run_tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
            - **Evidence:** Download `test-report-py${{ matrix.python-version }}` from the **Summary** tab.
            - [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})