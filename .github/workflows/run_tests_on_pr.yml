name: PR Multi-Version Tests

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened] 

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    name: Py ${{ matrix.python-version }}
    runs-on: ubuntu-latest # Everything runs on the latest, no more infinite queues
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    
    env:
      # Global fix for setuptools-scm metadata errors
      SETUPTOOLS_SCM_PRETEND_VERSION: "1.0.0.dev0"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 1. MODERN PYTHON HANDLING (3.8 to 3.14) ----
      - name: Setup Modern Python
        if: matrix.python-version != '3.6' && matrix.python-version != '3.7'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Test Modern Python
        if: matrix.python-version != '3.6' && matrix.python-version != '3.7'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-html setuptools-scm
          pip install .
          pytest --html=report-${{ matrix.python-version }}.html --self-contained-html

      # ---- 2. LEGACY PYTHON HANDLING (3.6 and 3.7) ----
      # We run this explicitly via Docker so the older glibc/SSL versions
      # don't conflict with GitHub's modern Node 20 runner requirements.
      - name: Test Legacy Python in Docker
        if: matrix.python-version == '3.6' || matrix.python-version == '3.7'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="1.0.0.dev0" \
            python:${{ matrix.python-version }}-slim \
            bash -c "
              apt-get update && apt-get install -y git && \
              git config --global --add safe.directory /app && \
              if [ '${{ matrix.python-version }}' = '3.6' ]; then
                pip install --upgrade 'pip<21.0' 'setuptools<60.0' wheel && \
                pip install 'pytest<7.0' 'pytest-html<3.0' 'setuptools-scm<7.0';
              else
                pip install --upgrade 'pip<23.1' 'setuptools<60.0' wheel && \
                pip install 'pytest<8.0' 'pytest-html<4.0' 'setuptools-scm<8.0';
              fi && \
              pip install . && \
              pytest --html=report-${{ matrix.python-version }}.html --self-contained-html
            "
          
          # Docker writes the HTML report as root. We must chown it back to the runner user
          # otherwise the upload-artifact step will fail with permission denied.
          sudo chown -R $USER:$USER "$GITHUB_WORKSPACE"

      # ---- 3. UPLOAD & REPORT ----
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: report-${{ matrix.python-version }}.html

      - name: Post Status Comment
        if: always()
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### 🧪 Test Results: Python ${{ matrix.python-version }}
            - **Status:** ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}
            - **Evidence:** Download `test-report-py${{ matrix.python-version }}` from the **Summary** tab.
            - [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})