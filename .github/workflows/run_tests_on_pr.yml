name: PR Multi-Version Tests

on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    name: Py ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.6.8 and 3.7 require specific handling for legacy pip/setuptools
        python-version: ["3.6.8", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    
    container:
      image: python:${{ matrix.python-version }}-slim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix EOL Repos and Install Git
        run: |
          # If the image is old (3.6/3.7), we may need to point to archive.debian.org
          if [ -f /etc/apt/sources.list ]; then
            sed -i 's/deb.debian.org/archive.debian.org/g' /etc/apt/sources.list
            sed -i 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' /etc/apt/sources.list
            sed -i '/stretch-updates/d' /etc/apt/sources.list
          fi
          apt-get update || true
          apt-get install -y git
          # Use the GITHUB_WORKSPACE environment variable instead of hardcoding paths
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Dependencies
        shell: bash
        run: |
          VERSION="${{ matrix.python-version }}"
          
          if [[ "$VERSION" == "3.6.8" ]]; then
            # Python 3.6: Last supported pip is 20.3.4, setuptools 59.6.0
            python -m pip install --upgrade "pip<21.0" "setuptools<60.0" "wheel"
            pip install "pytest<7.0" "pytest-html<3.0" "setuptools-scm<7.0"
          
          elif [[ "$VERSION" == "3.7" ]]; then
            # Python 3.7: Last supported pip is 23.0.1
            python -m pip install --upgrade "pip<23.1" "setuptools<60.0" "wheel"
            pip install "pytest<8.0" "pytest-html<4.0" "setuptools-scm<8.0"
          
          else
            # Modern Python
            python -m pip install --upgrade pip setuptools wheel
            pip install pytest pytest-html setuptools-scm
          fi
          
          # Install the local package
          pip install .

      - name: Run Tests
        id: run_tests
        run: |
          pytest --html=report-${{ matrix.python-version }}.html --self-contained-html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: report-${{ matrix.python-version }}.html

      - name: Post Status Comment
        if: always()
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### 🧪 Test Results: Python ${{ matrix.python-version }}
            - **Status:** ${{ steps.run_tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
            - **Evidence:** Download `test-report-py${{ matrix.python-version }}` from the **Summary** tab.
            - [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})