[project]
name = "tts-utilities"
description = "A starter repo to help users quickly set up a Teamtools Studio project with common structure, configs, and package scaffolding."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "Apache-2.0"}
authors = [
  { name = "shanemb", email = "shane.m.bonkowski@jpl.nasa.gov" },
  { name = "muszynsk", email = "matt.muszynski@jpl.nasa.gov" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "pytest", 
  "tomli", 
  "datetime",
  "rich",
  "ipynbname",
  "toml",
  "setuptools_scm",
  "jupyterlab"
]
dynamic = ["version"]

[project.scripts]
tts-certify = "tts_utilities.cli.inspection_certify:main"

[tool.pytest.ini_options]
markers = [
    "inspection: test produces visual output requiring human inspection and sha256 certification before passing",
    "unreviewed_ai: test was written or generated by AI and has not yet been reviewed line-by-line by a human",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[build-system]
requires = [
    "setuptools", 
    "setuptools_scm",
    "toml", 
    "wheel", 
    ]
build-backend = "setuptools.build_meta"